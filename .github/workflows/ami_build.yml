# .github/workflows/ami_build.yml

name: "Packer AMI 만들기"
on:
  push:
    branches:
      - master # master 브랜치의 push이면서
    paths:
      - "packer/**" # packer/ 하위 경로에 변화가 있을 때 동작하게 한다
    workflow_dispatch # 원할 때 deploy 할 수 있는 옵션
jobs:
  packer_build:
    runs-on: ubuntu-latest
    name: "Build AMI with packer & ansible"
    steps:
      - name: Checkout Repository # github 저장소로부터 소스코드 가져오기
        uses: actions/checkout@v4

      - name: Setup Packer
        uses: hashicorp/setup-packer@main
        with:
          version: "latest"

      - name: Aws Configure
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Packer Init & Build
        run: |
          packer init .
          packer build .
        working-directory: ./packer

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init & Apply
        run: |
          terraform init
          terraform apply --auto-approve
        working-directory: ./terraform